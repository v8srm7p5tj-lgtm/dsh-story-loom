<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="coast" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="12" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd9cf"/>
      <stop offset="0.55" stop-color="#c2d2c8"/>
      <stop offset="1" stop-color="#b5c8c0"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7dabe"/>
      <stop offset="1" stop-color="#d9c8a6"/>
    </linearGradient>
    <radialGradient id="trench" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#273b42" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#314a4f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#314a4f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#6e7f73" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="waves" width="90" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 13q11-7 22 0t22 0t22 0t22 0" fill="none" stroke="#7f988d" stroke-opacity="0.25" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#efe6d2"/>
  <rect width="1200" height="800" fill="url(#sea)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#waves)" opacity="0.6"/>
  <rect width="1200" height="800" filter="url(#paper)" opacity="0.9"/>

  <!-- 西境大陆 -->
  <path d="M0 0 L250 0 C232 48 262 96 236 142 C212 184 226 218 198 258 C176 290 186 326 204 360 C226 400 198 438 214 478 C232 522 206 560 214 604 C222 646 196 700 208 756 L210 800 L0 800 Z"
        fill="url(#land)" stroke="#6d5d45" stroke-width="4" filter="url(#coast)"/>
  <path d="M0 0 L250 0 C232 48 262 96 236 142 C212 184 226 218 198 258 C176 290 186 326 204 360 C226 400 198 438 214 478 C232 522 206 560 214 604 C222 646 196 700 208 756 L210 800 L0 800 Z"
        fill="none" stroke="#8f7b5c" stroke-opacity="0.45" stroke-width="1" transform="translate(8,0)"/>

  <!-- 北方群岛 -->
  <g filter="url(#coast)">
    <path d="M380 96 C420 70 470 82 486 108 C500 132 474 154 448 160 C420 168 388 154 374 132 C366 118 370 106 380 96 Z" fill="url(#land)" stroke="#6d5d45" stroke-width="3"/>
    <path d="M520 54 C552 38 590 48 598 72 C606 96 580 116 552 112 C524 108 506 84 520 54 Z" fill="url(#land)" stroke="#6d5d45" stroke-width="3"/>
    <path d="M640 132 C666 116 700 124 708 146 C716 168 694 186 670 184 C646 182 630 154 640 132 Z" fill="url(#land)" stroke="#6d5d45" stroke-width="3"/>
  </g>

  <!-- 东方礁群 -->
  <g filter="url(#coast)">
    <path d="M920 220 C954 200 984 214 988 238 C992 264 968 282 940 276 C914 270 902 240 920 220 Z" fill="#d8c8aa" stroke="#6d5d45" stroke-width="2.5"/>
    <path d="M1010 300 C1030 290 1050 298 1052 314 C1054 330 1038 340 1020 336 C1004 332 996 310 1010 300 Z" fill="#d8c8aa" stroke="#6d5d45" stroke-width="2"/>
    <path d="M945 360 C960 352 976 358 978 370 C980 382 968 390 954 386 C942 382 936 366 945 360 Z" fill="#d8c8aa" stroke="#6d5d45" stroke-width="2"/>
  </g>

  <!-- 雾港半岛 -->
  <path d="M300 500 C338 480 380 490 404 516 C430 544 422 578 448 604 C468 624 462 650 438 660 C408 672 384 652 360 638 C330 620 300 628 282 604 C264 580 282 558 270 536 C262 520 278 508 300 500 Z"
        fill="url(#land)" stroke="#6d5d45" stroke-width="4" filter="url(#coast)"/>
  <g font-family="'Songti SC','STSong','Noto Serif SC',serif" fill="#4a3d2d">
    <text x="332" y="570" font-size="26" letter-spacing="6">雾 港</text>
    <text x="332" y="596" font-size="12" letter-spacing="2" fill="#75644c">MIST HARBOR</text>
  </g>

  <!-- 黑礁灯塔岛 -->
  <path d="M800 330 C822 314 850 318 862 336 C874 356 862 380 840 388 C816 396 792 376 790 356 C789 346 792 338 800 330 Z"
        fill="#c9b896" stroke="#6d5d45" stroke-width="3" filter="url(#coast)"/>
  <g transform="translate(826,352)">
    <path d="M-7 20 L-4 -26 L4 -26 L7 20 Z" fill="#f3ead6" stroke="#5b4b35" stroke-width="2"/>
    <path d="M-7 -26 L0 -38 L7 -26 Z" fill="#9e2b25" stroke="#5b4b35" stroke-width="2"/>
    <circle cx="0" cy="-20" r="3" fill="#e8c46a"/>
  </g>
  <text x="782" y="410" font-family="'Songti SC','STSong','Noto Serif SC',serif" font-size="19" fill="#4a3d2d" letter-spacing="3">黑礁灯塔</text>

  <!-- 无光海沟 -->
  <ellipse cx="930" cy="610" rx="210" ry="115" fill="url(#trench)"/>
  <g fill="none" stroke="#20343a" stroke-opacity="0.65">
    <path d="M770 610 Q850 570 930 610 T1090 610" stroke-width="3"/>
    <path d="M780 626 Q860 592 940 626 T1080 626" stroke-width="2"/>
    <path d="M790 642 Q870 612 950 642 T1070 642" stroke-width="1.5"/>
  </g>
  <text x="870" y="680" font-family="'Songti SC','STSong','Noto Serif SC',serif" font-size="25" fill="#d8c8a6" letter-spacing="5">无 光 海 沟</text>
  <text x="884" y="702" font-size="11" fill="#b7a887" letter-spacing="3">THE LIGHTLESS TRENCH</text>

  <!-- 沉钟街 -->
  <g font-family="'Songti SC','STSong','Noto Serif SC',serif" fill="#4a3d2d">
    <path d="M372 648 l10 -12 l10 12 z" fill="none" stroke="#6d5d45" stroke-width="2"/>
    <text x="360" y="676" font-size="17" letter-spacing="2">沉钟街</text>
  </g>

  <!-- 航线 -->
  <path d="M356 570 Q520 480 610 526 T826 372" fill="none" stroke="#8b3a2e" stroke-opacity="0.6" stroke-width="2.5" stroke-dasharray="8 10"/>
  <path d="M356 570 Q500 640 640 610 T900 600" fill="none" stroke="#3f665c" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 9"/>

  <!-- 罗盘 -->
  <g transform="translate(1080,120)" stroke="#5b4b35" fill="none">
    <circle r="58" stroke-width="2"/>
    <circle r="46" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M0 -70 L10 -10 L70 0 L10 10 L0 70 L-10 10 L-70 0 L-10 -10 Z" fill="#efe4cc" stroke-width="1.5"/>
    <path d="M0 -70 L0 0 L-10 -10 Z" fill="#9e2b25" stroke="none"/>
    <path d="M0 70 L0 0 L10 10 Z" fill="#9e2b25" stroke="none"/>
    <text x="-6" y="-78" font-family="serif" font-size="14" fill="#5b4b35" stroke="none">N</text>
  </g>

  <!-- 比例尺 -->
  <g transform="translate(70,740)" stroke="#5b4b35" fill="none">
    <path d="M0 0 H180 M0 -5 V5 M60 -4 V4 M120 -4 V4 M180 -5 V5" stroke-width="2"/>
    <text x="0" y="-12" font-family="serif" font-size="11" fill="#5b4b35" stroke="none">0</text>
    <text x="170" y="-12" font-family="serif" font-size="11" fill="#5b4b35" stroke="none">30 里</text>
  </g>

  <!-- 标题框 -->
  <g transform="translate(60,54)">
    <rect width="330" height="92" fill="#efe4cc" fill-opacity="0.86" stroke="#5b4b35" stroke-width="2"/>
    <rect x="6" y="6" width="318" height="80" fill="none" stroke="#5b4b35" stroke-opacity="0.45" stroke-width="1"/>
    <text x="24" y="44" font-family="'Songti SC','STSong','Noto Serif SC',serif" font-size="30" fill="#3b3024" letter-spacing="8">雾港海域</text>
    <text x="26" y="70" font-family="serif" font-size="12" fill="#6f5d45" letter-spacing="4">THE MIST HARBOR SEA</text>
  </g>

  <!-- 外框 -->
  <rect x="18" y="18" width="1164" height="764" fill="none" stroke="#5b4b35" stroke-width="3"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#5b4b35" stroke-opacity="0.4" stroke-width="1"/>
</svg>
